<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 590" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1230" height="590" fill="#ffffff"/>
  <text x="615" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Newsletter Automation - Deep Agent Structure</text>

  <!-- ===== agent-to-agent / agent-to-memory connectors (90-degree bends only) ===== -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- Main Orchestrator -> subagents (bus midpoint aligned with the main trunk) -->
    <path d="M484,240 V275" />
    <path d="M223,275 H748" />
    <path d="M223,275 V300" marker-end="url(#arrow)" />
    <path d="M748,275 V300" marker-end="url(#arrow)" />
    <!-- memory file -> Main Orchestrator (read at run start) -->
    <path d="M960,95 H737" marker-end="url(#arrow)" />
  </g>

  <g stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6,4">
    <!-- Main Orchestrator -> memory file (append feedback) -->
    <path d="M737,65 H960" marker-end="url(#arrow-purple)" />
    <!-- memory file -> article-writer (preferences injected at build time) -->
    <path d="M1070,115 V200 H909 V300" marker-end="url(#arrow-purple)" />
  </g>

  <text x="849" y="58" text-anchor="middle" font-size="10" fill="#7c3aed">append feedback (write_file)</text>
  <text x="849" y="109" text-anchor="middle" font-size="10" fill="#334155">_read_memory() at run start</text>
  <text x="990" y="193" text-anchor="middle" font-size="10" fill="#7c3aed">preferences -&gt; article-writer prompt</text>

  <!-- ===== Main Orchestrator (agent card, tools nested inside) ===== -->
  <rect x="232" y="45" width="505" height="195" rx="10" fill="#4f46e5"/>
  <text x="484" y="73" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Main Orchestrator</text>
  <text x="484" y="91" text-anchor="middle" font-size="12" fill="#e0e7ff">create_deep_agent()</text>

  <!-- always-registered tools -->
  <g font-size="12" fill="#1e293b">
    <rect x="252" y="105" width="145" height="42" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="324" y="130" text-anchor="middle">save_article</text>
    <rect x="412" y="105" width="145" height="42" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="484" y="130" text-anchor="middle">merge_newsletter</text>
    <rect x="572" y="105" width="145" height="42" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="644" y="130" text-anchor="middle">create_svg_diagram</text>
  </g>

  <!-- conditional tools (run-mode dependent) -->
  <g fill="#78350f">
    <rect x="252" y="159" width="145" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5,3"/>
    <text x="324" y="177" text-anchor="middle" font-size="10">run_weekly_research</text>
    <text x="324" y="192" text-anchor="middle" font-size="8">if open_slots &gt; 0</text>

    <rect x="412" y="159" width="145" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5,3"/>
    <text x="484" y="177" text-anchor="middle" font-size="10">request_topic_selection</text>
    <text x="484" y="192" text-anchor="middle" font-size="8">open_slots&gt;0 and --hitl</text>

    <rect x="572" y="159" width="145" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5,3"/>
    <text x="644" y="177" text-anchor="middle" font-size="10">auto_select_topics</text>
    <text x="644" y="192" text-anchor="middle" font-size="8">open_slots&gt;0, not --hitl</text>
  </g>

  <!-- ===== memory file (persisted state, not a tool) ===== -->
  <rect x="960" y="45" width="220" height="70" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1070" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">memory/preferences.md</text>
  <text x="1070" y="94" text-anchor="middle" font-size="10" fill="#475569">persisted file, not a tool call</text>

  <!-- ===== topic-researcher (agent card, tools nested inside) ===== -->
  <rect x="50" y="300" width="345" height="130" rx="10" fill="#0d9488"/>
  <text x="223" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">topic-researcher</text>
  <text x="223" y="347" text-anchor="middle" font-size="10" fill="#ccfbf1">-&gt; TopicResearch</text>

  <g font-size="12" fill="#134e4a">
    <rect x="71" y="365" width="145" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
    <text x="144" y="383" text-anchor="middle">search_ai_news</text>
    <text x="144" y="398" text-anchor="middle" font-size="9">(Tavily)</text>

    <rect x="231" y="365" width="145" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
    <text x="304" y="383" text-anchor="middle">fetch_article</text>
    <text x="304" y="398" text-anchor="middle">_content</text>
  </g>

  <!-- ===== article-writer (agent card, tools nested inside) ===== -->
  <rect x="495" y="300" width="505" height="130" rx="10" fill="#0d9488"/>
  <text x="748" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">article-writer</text>
  <text x="748" y="347" text-anchor="middle" font-size="10" fill="#ccfbf1">build_article_writer_agent()</text>

  <g font-size="12" fill="#134e4a">
    <rect x="516" y="365" width="145" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
    <text x="589" y="383" text-anchor="middle">search_ai_news</text>
    <text x="589" y="398" text-anchor="middle" font-size="9">(Tavily)</text>

    <rect x="676" y="365" width="145" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
    <text x="749" y="383" text-anchor="middle">fetch_article</text>
    <text x="749" y="398" text-anchor="middle">_content</text>

    <rect x="836" y="365" width="145" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
    <text x="909" y="383" text-anchor="middle">create_svg</text>
    <text x="909" y="398" text-anchor="middle">_diagram</text>
  </g>

  <!-- ===== legend (centered under the full diagram, incl. memory annex) ===== -->
  <g font-size="13">
    <rect x="455" y="460" width="18" height="18" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4,3"/>
    <text x="485" y="474" fill="#334155">conditional tool (run-mode dependent)</text>
    <rect x="455" y="486" width="18" height="18" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="485" y="500" fill="#334155">always-registered tool</text>
    <rect x="455" y="512" width="18" height="18" rx="3" fill="#e2e8f0" stroke="#475569" stroke-dasharray="3,3"/>
    <text x="485" y="526" fill="#334155">persisted file (not a tool call)</text>
    <line x1="455" y1="547" x2="473" y2="547" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="485" y="551" fill="#334155">memory ingestion path</text>
  </g>
</svg>
