[project]
name = "newsletter-automation"
version = "0.1.0"
description = "AI-powered newsletter automation for Automata using LangGraph deepagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "headroom-ai[langchain]>=0.22.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit real external APIs (deselect with '-m not integration')",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
