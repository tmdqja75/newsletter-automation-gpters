        <rect x="410" y="98" width="120" height="22" rx="11" fill="#374151"/><text x="470" y="113">create_svg_diagram</text>
      </g>

      <!-- Human -->
      <path d="M484 81 H600" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a5)"/>
      <path d="M600 89 H486" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a5)"/>
      <rect x="600" y="58" width="72" height="54" rx="10" fill="#fefce8" stroke="#facc15"/>
      <circle cx="636" cy="74" r="7" fill="#ca8a04"/>
      <path d="M624 96 a12 10 0 0 1 24 0 z" fill="#ca8a04"/>
      <text x="636" y="107" text-anchor="middle" font-size="8.5" font-weight="700" fill="#854d0e">사용자</text>
      <text x="636" y="130" text-anchor="middle" font-size="8" fill="#854d0e">interrupt →</text>
      <text x="636" y="141" text-anchor="middle" font-size="8" fill="#854d0e">번호로 토픽 선택</text>

      <path d="M340 130 V156 M170 156 H510" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
      <path d="M170 156 V178" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a5)"/>
      <path d="M510 156 V178" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a5)"/>

      <!-- topic-researcher -->
      <rect x="40" y="180" width="260" height="108" rx="12" fill="#eef2ff" stroke="#6366f1"/>
      <text x="58" y="200" font-size="8" font-weight="700" fill="#6366f1">SUBAGENT</text>
      <text x="170" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">topic-researcher</text>
      <text x="170" y="222" text-anchor="middle" font-size="9" fill="#4b5563">사용자가 지정한 토픽 1개 리서치 → TopicResearch</text>
      <g font-size="9.5" text-anchor="middle" fill="#3730a3">
        <rect x="60" y="240" width="104" height="22" rx="11" fill="#fff" stroke="#c7d2fe"/><text x="112" y="255">search_ai_news</text>
